version: "3.9"

services:

  # ── Gradio UI + Agent (main app) ───────────────────────────────────────────
  app:
    build: .
    ports:
      - "7860:7860"         # Gradio UI
      - "8000:8000"         # FastAPI API (optional)
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - REDIS_URL=redis://redis:6379
      - SANDBOX_TYPE=${SANDBOX_TYPE:-subprocess}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # for Docker sandbox mode
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis (session persistence) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
